<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover is what makes apple-mobile-web-app-status-bar-style
      below mean anything. Without it the content is inset to the safe area and
      iOS fills the strip behind the clock itself, using the body's solid
      background-color and ignoring the gradients layered over it, which is why
      that strip read as a flat cream band that matched nothing.

      With it, the page runs under the status bar and the clock and battery sit
      on the gradient. The layout pays that back through env(safe-area-inset-*),
      so nothing important ends up underneath them.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Write with Nature</title>

    <!-- PWA -->
    <!--
      Must not be a relative href. Vite treats a relative one as a bundled asset
      and emits it hashed under assets/, and a manifest's start_url resolves
      against wherever the manifest itself is served from - so it pointed at
      /Write-With-Nature/assets/, which is not a page, and launching from the
      iOS home screen gave a 404. The base-url token below keeps it pointing at
      the untouched copy in public/ at the site root.
    -->
    <link rel="manifest" href="%BASE_URL%manifest.json" />
    <meta name="theme-color" content="#2d4a1e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Write w/ Nature" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <meta name="description" content="Compose text as NASA Landsat satellite imagery: rivers, glaciers and coastlines shaped into letters from orbit." />
    <meta property="og:title" content="Write with Nature" />
    <meta property="og:description" content="Compose words in NASA Landsat satellite imagery." />
    <!-- Absolute: link previews are fetched by scrapers with no page context,
         so this is the one URL here that cannot be relative. SITE_URL is
         substituted at build time; see vite.config.js. -->
    <meta property="og:image" content="%SITE_URL%/icon-512.png" />

    <!-- Fonts (Phase 3 will replace with self-hosted) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400;1,700&family=Crimson+Pro:wght@300;400&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
