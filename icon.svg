<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="#2d4a1e"/>

  <!-- Subtle paper texture rings -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#f0ead8" stroke-width="1" opacity="0.06"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="#f0ead8" stroke-width="1" opacity="0.04"/>

  <!-- Orbit arc (dashed) -->
  <ellipse cx="256" cy="256" rx="175" ry="80" fill="none" stroke="#c8962a" stroke-width="3" stroke-dasharray="12 8" opacity="0.45" transform="rotate(-25 256 256)"/>

  <!-- Satellite body -->
  <rect x="224" y="232" width="64" height="48" rx="8" fill="#f0ead8" opacity="0.92"/>
  <!-- Satellite detail lines -->
  <line x1="244" y1="244" x2="292" y2="244" stroke="#2d4a1e" stroke-width="2.5" opacity="0.3"/>
  <line x1="244" y1="252" x2="292" y2="252" stroke="#2d4a1e" stroke-width="2.5" opacity="0.3"/>
  <line x1="244" y1="260" x2="292" y2="260" stroke="#2d4a1e" stroke-width="2.5" opacity="0.3"/>
  <!-- Satellite antenna -->
  <line x1="256" y1="232" x2="256" y2="210" stroke="#f0ead8" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
  <circle cx="256" cy="206" r="5" fill="#e8b84b"/>

  <!-- Solar panels left -->
  <rect x="148" y="240" width="68" height="32" rx="5" fill="#4a7c3f" opacity="0.85"/>
  <line x1="164" y1="240" x2="164" y2="272" stroke="#f0ead8" stroke-width="1.5" opacity="0.3"/>
  <line x1="181" y1="240" x2="181" y2="272" stroke="#f0ead8" stroke-width="1.5" opacity="0.3"/>
  <line x1="198" y1="240" x2="198" y2="272" stroke="#f0ead8" stroke-width="1.5" opacity="0.3"/>
  <!-- Connector arm left -->
  <rect x="214" y="251" width="12" height="10" rx="2" fill="#ddd4b8"/>

  <!-- Solar panels right -->
  <rect x="296" y="240" width="68" height="32" rx="5" fill="#4a7c3f" opacity="0.85"/>
  <line x1="313" y1="240" x2="313" y2="272" stroke="#f0ead8" stroke-width="1.5" opacity="0.3"/>
  <line x1="330" y1="240" x2="330" y2="272" stroke="#f0ead8" stroke-width="1.5" opacity="0.3"/>
  <line x1="347" y1="240" x2="347" y2="272" stroke="#f0ead8" stroke-width="1.5" opacity="0.3"/>
  <!-- Connector arm right -->
  <rect x="286" y="251" width="12" height="10" rx="2" fill="#ddd4b8"/>

  <!-- Sun rays (bottom left) -->
  <g transform="translate(120 370)" opacity="0.7">
    <circle cx="0" cy="0" r="18" fill="#c8962a"/>
    <line x1="0" y1="-28" x2="0" y2="-22" stroke="#c8962a" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="22" x2="0" y2="28" stroke="#c8962a" stroke-width="3" stroke-linecap="round"/>
    <line x1="-28" y1="0" x2="-22" y2="0" stroke="#c8962a" stroke-width="3" stroke-linecap="round"/>
    <line x1="22" y1="0" x2="28" y2="0" stroke="#c8962a" stroke-width="3" stroke-linecap="round"/>
    <line x1="-20" y1="-20" x2="-15" y2="-15" stroke="#c8962a" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="15" y1="15" x2="20" y2="20" stroke="#c8962a" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="20" y1="-20" x2="15" y2="-15" stroke="#c8962a" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-15" y1="15" x2="-20" y2="20" stroke="#c8962a" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Leaf (top right) -->
  <g transform="translate(370 130)" opacity="0.75">
    <path d="M0 0 Q30 -20 40 -50 Q20 -30 -10 -20 Z" fill="#7ab648"/>
    <path d="M0 0 Q40 -50 40 -50" stroke="#4a7c3f" stroke-width="1.5" fill="none"/>
  </g>
  <g transform="translate(390 148)" opacity="0.55">
    <path d="M0 0 Q22 -14 28 -36 Q14 -22 -7 -14 Z" fill="#7ab648"/>
  </g>
</svg>
